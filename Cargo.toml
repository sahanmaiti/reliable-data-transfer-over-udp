[package]
name = "reliable_udp"
version = "0.1.0"
edition = "2021"
authors = [
    "Sahan Maiti <sahanmaiti@gmail.com>",
    "Soumyadeb Mukherjee",
    "Kashish Gupta",
    "Ashwika Burman",
]
description = "Reliable Data Transfer over UDP (CS-30003 Coding Assignment 1)"

[dependencies]
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
